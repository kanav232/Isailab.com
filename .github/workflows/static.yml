# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      # Tell Bing (which also powers ChatGPT search, Copilot and DuckDuckGo)
      # that the pages changed, so they're re-read quickly. Never fails the deploy.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: |
          KEY_FILE=$(ls | grep -E '^[0-9a-f]{32}\.txt$' | head -1)
          KEY=${KEY_FILE%.txt}
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"isailab.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://isailab.com/$KEY_FILE\",\"urlList\":[\"https://isailab.com/\",\"https://isailab.com/youth-ai-leadership\",\"https://isailab.com/apply\",\"https://isailab.com/llms.txt\"]}" \
            -w "IndexNow HTTP %{http_code}\n" || true
