<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found · ISAiL</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #EFEEEA;
      --ink: #1E1E1E;
      --red: #D9423A;
      --white: #FFFFFF;
      --muted: #5E5D5A;
      --line: rgba(30, 30, 30, 0.16);
      --gutter: clamp(20px, 4vw, 40px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Jost', system-ui, sans-serif;
      font-weight: 300;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .top,
    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px var(--gutter);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .top img {
      height: 30px;
      width: auto;
      display: block;
    }

    .bottom {
      color: var(--muted);
      border-top: 1px solid var(--line);
      margin: 0 var(--gutter);
      padding: 22px 0;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px var(--gutter);
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    .prompt {
      display: inline-flex;
      align-self: flex-start;
      align-items: center;
      background: var(--white);
      padding: 14px 20px;
      font-size: 17px;
      font-weight: 400;
      margin-bottom: 32px;
    }

    .caret {
      width: 2px;
      height: 1.15em;
      background: var(--red);
      margin-left: 2px;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    h1 {
      font-weight: 500;
      font-size: clamp(56px, 10vw, 140px);
      line-height: 0.95;
      letter-spacing: -0.02em;
    }

    .stop {
      color: var(--red);
    }

    p {
      font-size: clamp(18px, 1.6vw, 21px);
      color: var(--muted);
      margin-top: 28px;
      max-width: 30em;
      line-height: 1.55;
    }

    .actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 40px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      padding: 16px 26px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border: 1px solid currentColor;
      transition: background .25s, color .25s, border-color .25s;
    }

    .btn-solid {
      background: var(--red);
      border-color: var(--red);
      color: var(--white);
    }

    .btn-solid:hover {
      background: var(--ink);
      border-color: var(--ink);
    }

    .btn-line:hover {
      background: var(--ink);
      color: var(--paper);
    }

    @media (prefers-reduced-motion: reduce) {
      .caret {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="top">
    <a href="/" aria-label="ISAiL home"><img src="/assets/logo-dark.png" alt="ISAiL – Indo Secure AI Lab" width="64" height="30"></a>
    <span>Error 404</span>
  </div>

  <main>
    <div class="prompt" aria-hidden="true">Where did this page go?<span class="caret"></span></div>
    <h1>Page not found<span class="stop">.</span></h1>
    <p>The link you followed may be broken, or the page may have moved. Head back to the ISAiL homepage.</p>
    <div class="actions">
      <a class="btn btn-solid" href="/">Back to homepage</a>
      <a class="btn btn-line" href="/youth-ai-leadership">Youth AI Leadership Program</a>
    </div>
  </main>

  <div class="bottom">
    <span>isailab.com</span>
    <span>contact@isailab.com</span>
  </div>
</body>

</html>
